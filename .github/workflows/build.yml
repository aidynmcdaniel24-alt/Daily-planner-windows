# Builds the Windows app on GitHub's Windows computers every time code is pushed.
# Pushes to main also publish a new release with DailyPlannerSetup.exe.
name: Build Windows app

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Get the latest drills, ranks, quotes and projects from the website
      - uses: actions/checkout@v4
        with:
          repository: aidynmcdaniel24-alt/Daily-planner
          path: web

      - name: Copy the website's game data into the app
        run: node tools/export-data.js web src/DailyPlanner/Assets/data.json

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Add the Google sign-in secret
        shell: pwsh
        env:
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          if (-not $env:GOOGLE_CLIENT_SECRET) { Write-Host "::warning::GOOGLE_CLIENT_SECRET is not set, so Google sign-in will be off in this build."; exit 0 }
          $code = "namespace DailyPlanner.Services;`npublic static partial class Config`n{`n    public const string GoogleClientSecret = `"$($env:GOOGLE_CLIENT_SECRET)`";`n}`n"
          Set-Content -Path src\DailyPlanner\Services\Secrets.cs -Value $code

      - name: Build the app
        run: dotnet publish src/DailyPlanner/DailyPlanner.csproj -c Release -r win-x64 -p:Platform=x64 -p:Version=1.0.${{ github.run_number }} -o publish

      - name: Make the installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc "/DAppVersion=1.0.${{ github.run_number }}" installer\setup.iss
          Compress-Archive -Path publish\* -DestinationPath out\DailyPlanner-portable.zip

      - name: Check the app opens (smoke test)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force smoke | Out-Null
          $files = (Get-ChildItem publish -Recurse -Include *.pri,*.xbf,*.exe | ForEach-Object { $_.FullName.Replace((Resolve-Path publish).Path,'') }) -join ', '
          Write-Host "::notice title=Published files::$files"
          $p = Start-Process -FilePath publish\DailyPlanner.exe -PassThru
          Start-Sleep -Seconds 25
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("smoke\screen.png")
          $log = "$env:LOCALAPPDATA\DailyPlanner\errors.log"
          if (Test-Path $log) {
            Copy-Item $log smoke\errors.log
            $t = (Get-Content $log -Raw) -replace "`r",'' -replace "`n",'%0A'
            Write-Host "::error title=errors.log::$t"
          }
          if ($p.HasExited) {
            $ev = Get-WinEvent -LogName Application -MaxEvents 30 | Where-Object { $_.LevelDisplayName -eq 'Error' } | Select-Object -First 4
            $ev | Format-List TimeCreated, ProviderName, Message | Out-File smoke\events.txt
            foreach ($e in $ev) { $m = ($e.ProviderName + ': ' + $e.Message) -replace "`r",'' -replace "`n",'%0A'; if ($m.Length -gt 3000) { $m = $m.Substring(0,3000) }; Write-Host "::error title=Windows event::$m" }
            Write-Host "::error::App closed by itself (exit code $($p.ExitCode))"
            exit 1
          }
          Write-Host "App is running"
          Stop-Process -Id $p.Id
          Start-Sleep -Seconds 2

          # Second run: as a guest with sample data, to check the home screen
          $today = Get-Date -Format "yyyy-MM-dd"
          $state = @{ acct = "guest"; nm = "Aidyn"; done = 1; gl = "Rank up, Learn to code, Sleep better";
            dn = @{ ($today + "gaming") = @(0, 1); ($today + "sleep") = @(0,1,2,3,4) };
            ok = @{ ("sleep" + $today) = 1 } } | ConvertTo-Json -Depth 5
          New-Item -ItemType Directory -Force "$env:LOCALAPPDATA\DailyPlanner" | Out-Null
          Set-Content -Path "$env:LOCALAPPDATA\DailyPlanner\planner.json" -Value $state
          $p = Start-Process -FilePath publish\DailyPlanner.exe -PassThru
          Start-Sleep -Seconds 20
          $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("smoke\home.png")
          if (Test-Path $log) { Copy-Item $log smoke\errors.log -Force; $t = (Get-Content $log -Raw) -replace "`r",'' -replace "`n",'%0A'; Write-Host "::warning title=errors.log after home::$t" }
          if ($p.HasExited) {
            $ev = Get-WinEvent -LogName Application -MaxEvents 30 | Where-Object { $_.LevelDisplayName -eq 'Error' -and $_.ProviderName -ne 'Microsoft-Windows-Security-SPP' } | Select-Object -First 3
            foreach ($e in $ev) { $m = ($e.ProviderName + ': ' + $e.Message) -replace "`r",'' -replace "`n",'%0A'; if ($m.Length -gt 3000) { $m = $m.Substring(0,3000) }; Write-Host "::error title=Windows event (home)::$m" }
            Write-Host "::error::Home screen closed by itself (exit code $($p.ExitCode))"; exit 1
          }
          Stop-Process -Id $p.Id

          # Open every page and take a screenshot of each
          foreach ($pg in @("gaming","sleep","coding","summary","board","settings")) {
            Remove-Item $log -ErrorAction SilentlyContinue
            $p = Start-Process -FilePath publish\DailyPlanner.exe -ArgumentList "--page $pg" -PassThru
            Start-Sleep -Seconds 12
            $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save("smoke\$pg.png")
            if (Test-Path $log) { $t = (Get-Content $log -Raw) -replace "`r",'' -replace "`n",'%0A'; if ($t.Length -gt 4000) { $t = $t.Substring(0,4000) }; Write-Host "::warning title=errors.log on $pg::$t" }
            if ($p.HasExited) {
              $ev = Get-WinEvent -LogName Application -MaxEvents 30 | Where-Object { $_.LevelDisplayName -eq 'Error' -and $_.ProviderName -ne 'Microsoft-Windows-Security-SPP' } | Select-Object -First 2
              foreach ($e in $ev) { $m = ($e.ProviderName + ': ' + $e.Message) -replace "`r",'' -replace "`n",'%0A'; if ($m.Length -gt 3000) { $m = $m.Substring(0,3000) }; Write-Host "::error title=Windows event ($pg)::$m" }
              Write-Host "::error::The $pg page closed by itself (exit code $($p.ExitCode))"; exit 1
            }
            Stop-Process -Id $p.Id; Start-Sleep -Seconds 2
          }

      - uses: actions/upload-artifact@v4
        with:
          name: DailyPlanner-windows
          path: out/*

      - name: Publish a release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Daily Planner 1.0.${{ github.run_number }}
          body: |
            Download **DailyPlannerSetup.exe** below and run it to install Daily Planner on Windows.
            If Windows shows "Windows protected your PC", click **More info** then **Run anyway**.
          files: |
            out/DailyPlannerSetup.exe
            out/DailyPlanner-portable.zip

      - name: Save the smoke test screenshot to the smoke-results branch
        if: always()
        shell: pwsh
        run: |
          # Runs last because it swaps the folder to a separate branch
          if (-not (Test-Path smoke)) { exit 0 }
          git config user.name "build-bot"; git config user.email "build-bot@users.noreply.github.com"
          $dir = "$env:RUNNER_TEMP\sr"; New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item smoke\* $dir
          git checkout --orphan smoke-results
          git rm -rf --cached . | Out-Null
          Get-ChildItem -Force | Where-Object { $_.Name -ne '.git' } | Remove-Item -Recurse -Force
          Copy-Item "$dir\*" .
          git add -A; git commit -m "Smoke test results for run ${{ github.run_number }}" | Out-Null
          git push -f origin smoke-results
